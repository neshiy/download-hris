<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Seven Shine HRIS - Download & Install App</title>
  <meta name="description" content="Download and install the Seven Shine HRIS Mobile Application on iOS and Android." />
  <meta name="theme-color" content="#00a859" />

  <link rel="apple-touch-icon" href="assets/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Seven Shine HRIS" />
  <link rel="icon" type="image/png" href="assets/logo.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Floating Glowing Orbs -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <!-- Background Wallpaper Container -->
  <div class="background-wrapper">
    <img src="assets/background.jpg" alt="Background" class="bg-img" />
    <div class="bg-overlay"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Main Mobile App Frame -->
  <main class="app-container">
    <div class="content-card" id="cardContainer">
      
      <!-- Iridescent Card Border Light -->
      <div class="card-shimmer"></div>

      <!-- Pill Tag / Status Badge -->
      <div class="status-pill animate-fade-in">
        <span class="pulse-dot"></span>
        <span class="pill-text">HR MANAGEMENT SYSTEM</span>
      </div>

      <!-- Top Big Logo Section with Floating Glow -->
      <header class="logo-section">
        <div class="logo-aura"></div>
        <div class="logo-wrapper animate-float" id="mainLogo">
          <img src="assets/logo.png" alt="Seven Shine Logo" class="brand-logo" />
        </div>
      </header>

      <!-- Welcome & Instructions Text -->
      <section class="text-section">
        <h1 class="headline animate-slide-up delay-1">
          Hello!
        </h1>
        <p class="subheadline animate-slide-up delay-2">
          Download the <span class="highlight">Seven Shine HRIS</span> Mobile Application here.
        </p>
      </section>

      <!-- Download Buttons Stack -->
      <section class="action-stack">
        <!-- iOS Download Button -->
        <button class="download-btn ios-btn animate-slide-up delay-3" id="btnIos" aria-label="Install for iOS Users">
          <div class="btn-shimmer"></div>
          <div class="btn-icon">
            <!-- Apple SVG Icon -->
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.63-.77 1.06-1.84.94-2.92-.92.04-2.02.62-2.67 1.38-.58.67-1.09 1.76-.95 2.81 1.03.08 2.06-.5 2.68-1.27z"/>
            </svg>
          </div>
          <div class="btn-content">
            <span class="btn-label">DOWNLOAD FOR</span>
            <span class="btn-title">iOS Users</span>
          </div>
          <div class="btn-arrow">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </button>

        <!-- Android Download Button -->
        <button class="download-btn android-btn animate-slide-up delay-4" id="btnAndroid" aria-label="Install for Android Users">
          <div class="btn-shimmer"></div>
          <div class="btn-icon">
            <!-- Android SVG Icon -->
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
              <path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.551 0 .9993.4482.9993.9993.0001.5511-.4483.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993 0 .5511-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.411 13.856 8.089 12 8.089c-1.856 0-3.5902.322-5.1367.8607L4.841 5.4467a.4161.4161 0 00-.5677-.1521.4157.4157 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.761h24c-.3432-4.1021-2.6889-7.5743-6.1185-9.4396"/>
            </svg>
          </div>
          <div class="btn-content">
            <span class="btn-label">DOWNLOAD FOR</span>
            <span class="btn-title">Android Users</span>
          </div>
          <div class="btn-arrow">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </button>
      </section>

      <!-- Footer Info -->
      <footer class="card-footer animate-slide-up delay-5">
        <div class="footer-badge">
          <svg class="secure-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span class="footer-tag">Official HR Portal • Seven Shine</span>
        </div>
      </footer>
    </div>
  </main>

  <!-- Installation Modal Popup -->
  <div class="modal-overlay" id="installModal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card">
      <div class="modal-shimmer"></div>
      
      <!-- Close Button -->
      <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close modal">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- Modal App Icon -->
      <div class="modal-icon-wrapper">
        <img src="assets/logo.png" alt="Seven Shine App Logo" class="modal-app-logo" />
      </div>

      <!-- Modal Content Header -->
      <div class="modal-header">
        <span class="modal-badge" id="modalPlatformBadge">INSTALL WEB APP</span>
        <h3 class="modal-title" id="modalTitle">Install Seven Shine HRIS</h3>
        <p class="modal-subtitle" id="modalSubtitle">
          Save this application directly to your Home Screen for quick, fullscreen mobile access.
        </p>
      </div>

      <!-- Instructions Container (Dynamic per OS) -->
      <div class="modal-instructions" id="modalInstructions">
        <!-- Dynamically injected via script.js -->
      </div>

      <!-- Modal Action Buttons -->
      <div class="modal-actions">
        <button class="modal-primary-btn" id="modalPrimaryBtn">
          <svg class="btn-action-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span id="modalPrimaryBtnText">Download Application Now</span>
        </button>
        <button class="modal-secondary-btn" id="modalCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
